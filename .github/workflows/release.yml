# Builds the title and publishes dist/outsider-ps5-v<VERSION>.zip as a GitHub release.
#
# The build needs the PS5 build image and a JavaScriptCore build, which GitHub's hosted runners do not have, so
# this job runs on a self-hosted runner labelled `outsider-ps5` (Linux, Docker) that has:
#   - the Docker image named in IMAGE (default outsider-ps5-dev)
#   - the JavaScriptCore build, at the path in the runner variable JSC_OUT (see README, "Releasing")
# Push a tag `vX.Y.Z` matching the VERSION file to release; run it by hand to get the zip as a workflow artifact only.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: [self-hosted, linux, outsider-ps5]
    timeout-minutes: 90
    env:
      IMAGE: ${{ vars.IMAGE || 'outsider-ps5-dev' }}
      JSC_OUT: ${{ vars.JSC_OUT }}
    steps:
      - uses: actions/checkout@v4

      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, VERSION says $want"; exit 1; }

      - name: Outsider at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: edisnord/outsider
          token: ${{ secrets.OUTSIDER_TOKEN || github.token }}
          path: outsider-src
          fetch-depth: 0

      - name: pin Outsider
        run: git -C outsider-src checkout --detach "$(tr -d '[:space:]' < OUTSIDER_REV)"

      - name: build
        env:
          OUTSIDER_SRC: ${{ github.workspace }}/outsider-src
        run: |
          [ -n "$JSC_OUT" ] || { echo "set the runner variable JSC_OUT to the JavaScriptCore build"; exit 1; }
          scripts/build.sh outsider link launcher

      - name: package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: outsider-ps5
          path: dist/*

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "Outsider PS5 $GITHUB_REF_NAME" --prerelease \
            --notes "Early alpha. Copy the PPSA77110 folder from the zip to /data/homebrew on the console; see the README for use and known limits."
