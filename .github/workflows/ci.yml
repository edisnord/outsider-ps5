name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh
      - name: files the release needs
        run: |
          test -s VERSION
          test -s OUTSIDER_REV
          test -s sce_sys/icon0.png
          python3 -c 'import json;json.load(open("sce_sys/param.json"))'
